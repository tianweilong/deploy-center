name: 发布服务

on:
  repository_dispatch:
    types:
      - deploy-center-release
  workflow_dispatch:
    inputs:
      service_name:
        description: 服务名
        required: true
        type: string
      source_ref:
        description: 源引用
        required: true
        type: string
      source_sha:
        description: 源提交 SHA
        required: true
        type: string
      source_tag:
        description: 源标签，格式 vYYYY.M.D-HHmm
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  SERVICE_NAME: ${{ github.event.client_payload.service_name || inputs.service_name }}
  SOURCE_REF: ${{ github.event.client_payload.source_ref || inputs.source_ref }}
  SOURCE_SHA: ${{ github.event.client_payload.source_sha || inputs.source_sha }}
  SOURCE_TAG: ${{ github.event.client_payload.source_tag || inputs.source_tag }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      service_request: ${{ steps.resolve.outputs.service_request }}
      has_image: ${{ steps.resolve.outputs.has_image }}
      has_npm: ${{ steps.resolve.outputs.has_npm }}
      image_matrix: ${{ steps.resolve.outputs.image_matrix }}
      npm_matrix: ${{ steps.resolve.outputs.npm_matrix }}
    steps:
      - uses: actions/checkout@v6

      - id: resolve
        name: 解析发布请求
        run: |
          set -euo pipefail
          cat > /tmp/release-input.json <<JSON
          {
            "service_name": "${SERVICE_NAME}",
            "source_ref": "${SOURCE_REF}",
            "source_sha": "${SOURCE_SHA}",
            "source_tag": "${SOURCE_TAG}"
          }
          JSON
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            node scripts/resolve-release-request.mjs config/services.yaml /tmp/release-input.json > /tmp/service-request.json
          {
            echo 'service_request<<EOF'
            cat /tmp/service-request.json
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
          node <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('/tmp/service-request.json', 'utf8'));
          const runnerForPlatform = (platform) => {
            if (platform === 'linux/amd64') return 'ubuntu-latest';
            if (platform === 'linux/arm64') return 'ubuntu-24.04-arm';
            throw new Error(`不支持的镜像平台：${platform}`);
          };
          const imageMatrix = {
            include: request.has_image
              ? request.platforms.map((platform) => ({
                  platform,
                  platform_pair: platform.replaceAll('/', '-'),
                  runner: runnerForPlatform(platform),
                }))
              : [],
          };
          console.log(`has_image=${request.has_image}`);
          console.log(`has_npm=${request.has_npm}`);
          console.log(`image_matrix=${JSON.stringify(imageMatrix)}`);
          console.log(`npm_matrix=${JSON.stringify({ include: request.npm_platforms ?? [] })}`);
          NODE

  build-and-push-ghcr:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_image == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - id: image-env
        name: 解析镜像构建环境
        env:
          SERVICE_REQUEST: ${{ needs.prepare.outputs.service_request }}
        run: |
          printf '%s\n' "${SERVICE_REQUEST}" > /tmp/service-request.json
          node <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('/tmp/service-request.json', 'utf8'));
          const outputs = {
            service_name: request.service_name,
            source_repository: request.source_repository,
            source_owner: request.source_repository.split('/')[0],
            source_repository_name: request.source_repository.split('/')[1],
            build_context: request.build_context,
            dockerfile_path: request.dockerfile_path,
            ghcr_image_repository: request.ghcr_image_repository,
            image_tag: request.image_tag,
            build_args_json: JSON.stringify(request.build_args ?? {}),
          };
          for (const [key, value] of Object.entries(outputs)) {
            console.log(`${key}=${value}`);
          }
          NODE

      - name: 生成源仓库检出 token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPLOY_CENTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_CENTER_APP_PRIVATE_KEY }}
          owner: ${{ steps.image-env.outputs.source_owner }}
          repositories: ${{ steps.image-env.outputs.source_repository_name }}
          permission-contents: read

      - uses: ./.github/actions/checkout-source
        with:
          repository: ${{ steps.image-env.outputs.source_repository }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 1

      - uses: ./.github/actions/print-runner-info
        with:
          target-os: linux

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: build
        name: 构建并推送平台镜像 digest
        working-directory: source
        env:
          SOURCE_REPOSITORY: ${{ steps.image-env.outputs.source_repository }}
          BUILD_CONTEXT: ${{ steps.image-env.outputs.build_context }}
          DOCKERFILE_PATH: ${{ steps.image-env.outputs.dockerfile_path }}
          GHCR_IMAGE_REPOSITORY: ${{ steps.image-env.outputs.ghcr_image_repository }}
          BUILD_ARGS_JSON: ${{ steps.image-env.outputs.build_args_json }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mapfile -t docker_build_args < <(BUILD_ARGS_JSON="${BUILD_ARGS_JSON}" node <<'NODE'
          const buildArgs = JSON.parse(process.env.BUILD_ARGS_JSON || '{}');
          for (const [key, value] of Object.entries(buildArgs)) {
            console.log('--build-arg');
            console.log(`${key}=${value}`);
          }
          NODE
          )
          docker buildx build \
            "${docker_build_args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${SOURCE_REPOSITORY}" \
            --platform "${PLATFORM}" \
            -f "${DOCKERFILE_PATH}" \
            --output "type=image,name=${GHCR_IMAGE_REPOSITORY},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/build-metadata.json \
            "${BUILD_CONTEXT}"
          digest=$(node <<'NODE'
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync('/tmp/build-metadata.json', 'utf8'));
          process.stdout.write(metadata['containerimage.digest'] || '');
          NODE
          )
          if [ -z "${digest}" ]; then
            echo '构建未返回镜像 digest。' >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: 导出镜像 digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: 上传镜像 digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ steps.image-env.outputs.service_name }}--${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-ghcr-manifest:
    needs:
      - prepare
      - build-and-push-ghcr
    if: ${{ needs.prepare.outputs.has_image == 'true' && needs.build-and-push-ghcr.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: image-env
        name: 解析镜像 manifest 环境
        env:
          SERVICE_REQUEST: ${{ needs.prepare.outputs.service_request }}
        run: |
          printf '%s\n' "${SERVICE_REQUEST}" > /tmp/service-request.json
          node <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('/tmp/service-request.json', 'utf8'));
          console.log(`service_name=${request.service_name}`);
          console.log(`ghcr_image_repository=${request.ghcr_image_repository}`);
          console.log(`image_tag=${request.image_tag}`);
          NODE

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 下载镜像 digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digest-${{ steps.image-env.outputs.service_name }}--*
          merge-multiple: true

      - name: 合并 GHCR manifest
        env:
          GHCR_IMAGE_REPOSITORY: ${{ steps.image-env.outputs.ghcr_image_repository }}
          IMAGE_TAG: ${{ steps.image-env.outputs.image_tag }}
        run: |
          set -euo pipefail
          image_refs=()
          while IFS= read -r digest_file; do
            digest="sha256:$(basename "${digest_file}")"
            image_refs+=("${GHCR_IMAGE_REPOSITORY}@${digest}")
          done < <(find /tmp/digests -maxdepth 1 -type f -print | sort)

          if [ "${#image_refs[@]}" -eq 0 ]; then
            echo '没有找到待合并的镜像 digest。' >&2
            exit 1
          fi

          docker buildx imagetools create \
            -t "${GHCR_IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            -t "${GHCR_IMAGE_REPOSITORY}:latest" \
            "${image_refs[@]}"

  prepare-npm-publish-input:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_npm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: npm-env
        name: 解析 npm 发布环境
        env:
          SERVICE_REQUEST: ${{ needs.prepare.outputs.service_request }}
        run: |
          printf '%s\n' "${SERVICE_REQUEST}" > /tmp/service-request.json
          node <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('/tmp/service-request.json', 'utf8'));
          const outputs = {
            source_repository: request.source_repository,
            source_owner: request.source_repository.split('/')[0],
            source_repository_name: request.source_repository.split('/')[1],
            npm_package_name: request.npm_package_name,
            npm_package_dir: request.npm_package_dir,
            npm_dist_tag: request.npm_dist_tag,
            npm_version_strategy: request.npm_version_strategy,
          };
          for (const [key, value] of Object.entries(outputs)) {
            console.log(`${key}=${value}`);
          }
          NODE

      - name: 生成源仓库检出 token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPLOY_CENTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_CENTER_APP_PRIVATE_KEY }}
          owner: ${{ steps.npm-env.outputs.source_owner }}
          repositories: ${{ steps.npm-env.outputs.source_repository_name }}
          permission-contents: read

      - uses: ./.github/actions/checkout-source
        with:
          repository: ${{ steps.npm-env.outputs.source_repository }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 0

      - name: 检测 Go module 文件
        id: detect-go-module
        shell: bash
        run: |
          if [ -f source/go.mod ]; then
            echo "path=source/go.mod" >> "$GITHUB_OUTPUT"
          elif [ -f source/go/go.mod ]; then
            echo "path=source/go/go.mod" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Go
        if: ${{ steps.detect-go-module.outputs.path != '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.detect-go-module.outputs.path }}
          cache: true

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          pnpm-version: 10.13.1
          lockfile-path: source/pnpm-lock.yaml
          npm-version: 11.5.1

      - uses: ./.github/actions/print-runner-info
        with:
          target-os: linux

      - name: 安装 Rust 工具链
        if: ${{ hashFiles('source/rust-toolchain.toml', 'source/rust-toolchain') != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: 准备 npm 发布输入
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          OUTPUT_DIR: ../npm-publish-input
          SOURCE_TAG: ${{ env.SOURCE_TAG }}
          NPM_PACKAGE_NAME: ${{ steps.npm-env.outputs.npm_package_name }}
          NPM_PACKAGE_DIR: ${{ steps.npm-env.outputs.npm_package_dir }}
          NPM_DIST_TAG: ${{ steps.npm-env.outputs.npm_dist_tag }}
          NPM_VERSION_STRATEGY: ${{ steps.npm-env.outputs.npm_version_strategy }}
        run: node scripts/prepare-npm-publish-input.mjs source

      - name: 上传 npm 发布输入
        uses: actions/upload-artifact@v4
        with:
          name: npm-publish-input
          path: npm-publish-input
          if-no-files-found: error

  release-npm-assets:
    needs:
      - prepare
      - prepare-npm-publish-input
    if: ${{ needs.prepare.outputs.has_npm == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.npm_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - id: npm-env
        name: 解析 npm 发布环境
        shell: bash
        env:
          SERVICE_REQUEST: ${{ needs.prepare.outputs.service_request }}
        run: |
          printf '%s\n' "${SERVICE_REQUEST}" > /tmp/service-request.json
          node <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('/tmp/service-request.json', 'utf8'));
          const outputs = {
            source_repository: request.source_repository,
            source_owner: request.source_repository.split('/')[0],
            source_repository_name: request.source_repository.split('/')[1],
            npm_package_name: request.npm_package_name,
            npm_package_dir: request.npm_package_dir,
            npm_dist_tag: request.npm_dist_tag,
            npm_version_strategy: request.npm_version_strategy,
          };
          for (const [key, value] of Object.entries(outputs)) {
            console.log(`${key}=${value}`);
          }
          NODE

      - name: 生成源仓库检出 token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPLOY_CENTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_CENTER_APP_PRIVATE_KEY }}
          owner: ${{ steps.npm-env.outputs.source_owner }}
          repositories: ${{ steps.npm-env.outputs.source_repository_name }}
          permission-contents: read

      - uses: ./.github/actions/checkout-source
        with:
          repository: ${{ steps.npm-env.outputs.source_repository }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 0

      - name: 检测 Go module 文件
        id: detect-go-module
        shell: bash
        run: |
          if [ -f source/go.mod ]; then
            echo "path=source/go.mod" >> "$GITHUB_OUTPUT"
          elif [ -f source/go/go.mod ]; then
            echo "path=source/go/go.mod" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Go
        if: ${{ steps.detect-go-module.outputs.path != '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.detect-go-module.outputs.path }}
          cache: true

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          pnpm-version: 10.13.1
          lockfile-path: source/pnpm-lock.yaml
          npm-version: 11.5.1

      - uses: ./.github/actions/print-runner-info
        with:
          target-os: ${{ matrix.target_os }}

      - name: 安装 Rust 工具链
        if: ${{ hashFiles('source/rust-toolchain.toml', 'source/rust-toolchain') != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Tauri CLI
        if: ${{ steps.npm-env.outputs.npm_package_name == '@vino.tian/vibe-kanban' && matrix.target == 'darwin-arm64' }}
        run: cargo install tauri-cli --version '^2' --locked

      - name: 构建 npm 平台产物
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          BUILD_ONLY: true
          BUILD_DESKTOP_BUNDLE: ${{ steps.npm-env.outputs.npm_package_name == '@vino.tian/vibe-kanban' && matrix.target == 'darwin-arm64' }}
          DESKTOP_RELEASE_MODE: ${{ steps.npm-env.outputs.npm_package_name == '@vino.tian/vibe-kanban' && matrix.target == 'darwin-arm64' && 'required' || 'auto' }}
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BUILD_ARTIFACT_DIR: ../npm-artifacts/${{ matrix.target }}
          SOURCE_TAG: ${{ env.SOURCE_TAG }}
          NPM_PACKAGE_NAME: ${{ steps.npm-env.outputs.npm_package_name }}
          NPM_PACKAGE_DIR: ${{ steps.npm-env.outputs.npm_package_dir }}
          NPM_DIST_TAG: ${{ steps.npm-env.outputs.npm_dist_tag }}
          NPM_VERSION_STRATEGY: ${{ steps.npm-env.outputs.npm_version_strategy }}
        run: node scripts/build-npm-release-assets.mjs source

      - name: 上传 npm 平台产物
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ matrix.target }}
          path: |
            npm-artifacts/${{ matrix.target }}/*.${{ matrix.archive_ext }}
            npm-artifacts/${{ matrix.target }}/*-checksums.txt
            npm-artifacts/${{ matrix.target }}/*.app.tar.gz
            npm-artifacts/${{ matrix.target }}/*.AppImage.tar.gz
            npm-artifacts/${{ matrix.target }}/*-setup.exe
            npm-artifacts/${{ matrix.target }}/*.sig
            npm-artifacts/${{ matrix.target }}/*-desktop-manifest-fragment.json
            npm-artifacts/${{ matrix.target }}/*-tauri-updater-fragment.json
          if-no-files-found: error

  release-github-release:
    needs:
      - prepare
      - prepare-npm-publish-input
      - release-npm-assets
    if: ${{ needs.prepare.outputs.has_npm == 'true' && needs.release-npm-assets.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: npm-env
        name: 解析 npm 发布环境
        env:
          SERVICE_REQUEST: ${{ needs.prepare.outputs.service_request }}
        run: |
          printf '%s\n' "${SERVICE_REQUEST}" > /tmp/service-request.json
          node <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('/tmp/service-request.json', 'utf8'));
          const outputs = {
            source_repository: request.source_repository,
            source_owner: request.source_repository.split('/')[0],
            source_repository_name: request.source_repository.split('/')[1],
            npm_package_name: request.npm_package_name,
          };
          for (const [key, value] of Object.entries(outputs)) {
            console.log(`${key}=${value}`);
          }
          NODE

      - name: 生成源仓库检出 token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPLOY_CENTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_CENTER_APP_PRIVATE_KEY }}
          owner: ${{ steps.npm-env.outputs.source_owner }}
          repositories: ${{ steps.npm-env.outputs.source_repository_name }}
          permission-contents: read

      - uses: ./.github/actions/checkout-source
        with:
          repository: ${{ steps.npm-env.outputs.source_repository }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 0

      - name: 下载 npm 平台产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: npm-package-*

      - name: 合并多平台校验文件
        run: |
          set -euo pipefail
          node scripts/merge-release-checksums.mjs release-artifacts

      - name: 合并桌面 manifest
        run: |
          set -euo pipefail
          node scripts/merge-desktop-manifest.mjs release-artifacts

      - name: 合并 Tauri updater
        run: |
          set -euo pipefail
          node scripts/merge-tauri-updater-json.mjs release-artifacts "${{ github.repository }}"

      - name: 生成 GitHub Release tag
        id: release-tag
        env:
          NPM_PACKAGE_NAME: ${{ steps.npm-env.outputs.npm_package_name }}
        run: |
          set -euo pipefail
          echo "tag=${NPM_PACKAGE_NAME##*/}-${SOURCE_TAG}" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.release-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.release-tag.outputs.tag }}" \
            --notes "npm release assets for ${{ steps.npm-env.outputs.npm_package_name }}@${SOURCE_TAG}"

      - name: 上传 GitHub Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find release-artifacts -type f | sort > /tmp/release-assets.txt
          while IFS= read -r asset; do
            gh release upload "${{ steps.release-tag.outputs.tag }}" "$asset" \
              --repo "${{ github.repository }}" \
              --clobber
          done < /tmp/release-assets.txt

  release-npm:
    needs:
      - prepare
      - prepare-npm-publish-input
      - release-github-release
    if: ${{ needs.prepare.outputs.has_npm == 'true' && needs.release-github-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: npm-env
        name: 解析 npm 发布环境
        env:
          SERVICE_REQUEST: ${{ needs.prepare.outputs.service_request }}
        run: |
          printf '%s\n' "${SERVICE_REQUEST}" > /tmp/service-request.json
          node <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('/tmp/service-request.json', 'utf8'));
          const outputs = {
            source_repository: request.source_repository,
            source_owner: request.source_repository.split('/')[0],
            source_repository_name: request.source_repository.split('/')[1],
            npm_package_name: request.npm_package_name,
            npm_package_dir: request.npm_package_dir,
            npm_dist_tag: request.npm_dist_tag,
            npm_version_strategy: request.npm_version_strategy,
          };
          for (const [key, value] of Object.entries(outputs)) {
            console.log(`${key}=${value}`);
          }
          NODE

      - name: 生成源仓库检出 token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPLOY_CENTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_CENTER_APP_PRIVATE_KEY }}
          owner: ${{ steps.npm-env.outputs.source_owner }}
          repositories: ${{ steps.npm-env.outputs.source_repository_name }}
          permission-contents: read

      - uses: ./.github/actions/checkout-source
        with:
          repository: ${{ steps.npm-env.outputs.source_repository }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24
          pnpm-version: 10.13.1
          lockfile-path: source/pnpm-lock.yaml
          npm-version: 11.5.1

      - name: 下载 npm 发布输入
        uses: actions/download-artifact@v4
        with:
          name: npm-publish-input
          path: npm-publish-input

      - name: 通过 Trusted Publishing 发布轻量 npm 包
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node scripts/publish-npm-package.mjs npm-publish-input
