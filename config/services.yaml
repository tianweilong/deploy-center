services:
  cli-proxy-api:
    sourceRepository: tianweilong/docker-mirror
    buildContext: images/cli-proxy-api
    dockerfilePath: images/cli-proxy-api/Dockerfile
    ghcrImageRepository: ghcr.io/tianweilong/cli-proxy-api
    defaultPlatforms:
      - linux/amd64
      - linux/arm64

  postgres17:
