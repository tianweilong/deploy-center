  karakeep-chrome:
    sourceRepository: tianweilong/docker-mirror
    buildContext: images/karakeep-chrome
    dockerfilePath: images/karakeep-chrome/Dockerfile
    ghcrImageRepository: ghcr.io/tianweilong/karakeep-chrome
    defaultPlatforms:
      - linux/amd64
      - linux/arm64

  meilisearch:
    sourceRepository: tianweilong/docker-mirror
    buildContext: images/meilisearch
    dockerfilePath: images/meilisearch/Dockerfile
    ghcrImageRepository: ghcr.io/tianweilong/meilisearch
    defaultPlatforms:
      - linux/amd64
      - linux/arm64

  lobehub:
    sourceRepository: tianweilong/lobehub
    buildContext: .
    dockerfilePath: Dockerfile
    ghcrImageRepository: ghcr.io/tianweilong/lobehub
    defaultPlatforms:
      - linux/amd64
      - linux/arm64

  new-api:
    sourceRepository: tianweilong/new-api
    buildContext: .
    dockerfilePath: Dockerfile
    ghcrImageRepository: ghcr.io/tianweilong/new-api
    defaultPlatforms:
      - linux/amd64
      - linux/arm64

  vibe-kanban-remote:
    sourceRepository: tianweilong/vibe-kanban
    buildContext: .
    dockerfilePath: crates/remote/Dockerfile
    ghcrImageRepository: ghcr.io/tianweilong/vibe-kanban-remote
    defaultPlatforms:
      - linux/amd64
      - linux/arm64

  vibe-kanban-relay:
    sourceRepository: tianweilong/vibe-kanban
    buildContext: .
    dockerfilePath: crates/relay-tunnel/Dockerfile
    ghcrImageRepository: ghcr.io/tianweilong/vibe-kanban-relay
    defaultPlatforms:
      - linux/amd64
      - linux/arm64

  we-mp-rss:
    sourceRepository: tianweilong/we-mp-rss
    buildContext: .
    dockerfilePath: Dockerfile
    ghcrImageRepository: ghcr.io/tianweilong/we-mp-rss
    defaultPlatforms:
      - linux/amd64
      - linux/arm64

  vibe-kanban-npm:
    sourceRepository: tianweilong/vibe-kanban
    npmPackageName: '@vino.tian/vibe-kanban'
    npmPackageDir: npx-cli
    npmVersionStrategy: calendar_tag
    npmDistTag: latest
    npmPlatforms:
      - runner: ubuntu-latest
        target: linux-x64
        targetOs: linux
        targetArch: x64
        archiveExt: tar.gz
      - runner: ubuntu-latest
        target: linux-arm64
        targetOs: linux
        targetArch: arm64
        archiveExt: tar.gz
      - runner: windows-latest
        target: win32-x64
        targetOs: win32
        targetArch: x64
        archiveExt: zip
      - runner: macos-15
        target: darwin-arm64
        targetOs: darwin
        targetArch: arm64
        archiveExt: tar.gz

  myte:
    sourceRepository: tianweilong/myte
    npmPackageName: '@vino.tian/myte'
    npmPackageDir: npm/myte
    npmVersionStrategy: calendar_tag
    npmDistTag: latest
    npmPlatforms:
      - runner: ubuntu-latest
        target: linux-x64
        targetOs: linux
        targetArch: x64
        archiveExt: tar.gz
      - runner: ubuntu-latest
        target: linux-arm64
        targetOs: linux
        targetArch: arm64
        archiveExt: tar.gz
      - runner: windows-latest
        target: win32-x64
        targetOs: win32
        targetArch: x64
        archiveExt: zip
      - runner: macos-15
        target: darwin-arm64
        targetOs: darwin
        targetArch: arm64
        archiveExt: tar.gz
